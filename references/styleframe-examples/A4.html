<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f5f5f0;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1a1a1a;
      }
      /* capsule atmosphere: cream ground + radial candy glows (on the scene, never the world) */
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 38%, rgba(197, 181, 224, 0.28), transparent 46%),
          radial-gradient(circle at 82% 62%, rgba(242, 209, 96, 0.22), transparent 44%),
          radial-gradient(circle at 50% 50%, rgba(139, 180, 247, 0.12), transparent 60%),
          #f5f5f0;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      }
      /* the one camera wrapper (viewport-change); world coords, origin = frame center */
      .world {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .desk-a,
      .desk-b {
        position: absolute;
        border: 3px solid #1e1e1e;
        border-radius: 64px;
        background: rgba(255, 255, 255, 0.55);
      }
      .desk-a {
        left: 60px;
        top: 560px;
        width: 960px;
        height: 820px;
      }
      .desk-b {
        left: 1250px;
        top: 540px;
        width: 900px;
        height: 760px;
      }
      .float-pill {
        position: absolute;
        border: 3px solid #1e1e1e;
        border-radius: 9999px;
      }
      .btn {
        position: absolute;
        left: 320px;
        top: 1110px;
        width: 440px;
        height: 140px;
        border: 4px solid #1e1e1e;
        border-radius: 9999px;
        background: #e85d4e;
        box-shadow: 8px 8px 0 rgba(26, 26, 26, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1a1a1a;
      }
      .slot {
        position: absolute;
        left: 190px;
        top: 690px;
        width: 700px;
        height: 260px;
        border: 4px dashed rgba(30, 30, 30, 0.45);
        border-radius: 2rem;
        opacity: 0;
      }
      .card {
        position: absolute;
        left: 190px;
        top: 690px;
        width: 700px;
        height: 260px;
        border: 4px solid #1e1e1e;
        border-radius: 2rem;
        background: #ffffff;
        box-shadow: 8px 8px 0 rgba(26, 26, 26, 0.1);
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 40px 0 30px;
        transform-origin: 50% 50%;
        z-index: 5;
      }
      .grip {
        display: grid;
        grid-template-columns: 12px 12px;
        gap: 10px;
      }
      .grip i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #1a1a1a;
        opacity: 0.55;
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .tag {
        align-self: flex-start;
        border: 3px solid #1e1e1e;
        border-radius: 9999px;
        background: #c4d94e;
        padding: 6px 22px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .card-title {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.05;
        white-space: nowrap;
      }
      .panel {
        position: absolute;
        left: 1300px;
        top: 600px;
        width: 800px;
        height: 640px;
        border: 4px solid #1e1e1e;
        border-radius: 2rem;
        background: #ffffff;
        box-shadow: 8px 8px 0 rgba(26, 26, 26, 0.1);
        padding: 56px 60px;
      }
      .type-line {
        display: flex;
        align-items: center;
        height: 96px;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: -0.02em;
        white-space: pre;
      }
      .caret {
        display: inline-block;
        width: 14px;
        height: 78px;
        margin-left: 6px;
        border-radius: 9999px;
        background: #a06ce8;
      }
      .bar {
        height: 40px;
        margin-top: 30px;
        border: 3px solid #1e1e1e;
        border-radius: 9999px;
        transform-origin: 0% 50%;
        transform: scaleX(0);
      }
      .next {
        position: absolute;
        left: 60px;
        bottom: 56px;
        border: 4px solid #1e1e1e;
        border-radius: 9999px;
        background: #f2d160;
        padding: 18px 44px;
        font-size: 42px;
        font-weight: 800;
        box-shadow: 6px 6px 0 rgba(26, 26, 26, 0.12);
        transform-origin: 50% 50%;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        transform-origin: 0 0;
        pointer-events: none;
        z-index: 10;
      }
      .cursor svg {
        position: absolute;
        overflow: visible;
        filter: drop-shadow(6px 8px 0 rgba(26, 26, 26, 0.16));
      }
      #cur-arrow {
        left: 0;
        top: 0;
      }
      #cur-open,
      #cur-fist {
        left: -48px;
        top: -44px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene" class="scene">
        <div id="world" class="world" data-layout-allow-overflow>
          <!-- decorative wallpaper pills (flat, no text) -->
          <div class="float-pill" style="left:-40px;top:1470px;width:220px;height:70px;background:#a8e6cf;transform:rotate(-18deg)"></div>
          <div class="float-pill" style="left:1000px;top:640px;width:180px;height:62px;background:#c5b5e0;transform:rotate(14deg)"></div>
          <div class="float-pill" style="left:1220px;top:1420px;width:240px;height:74px;background:#f5b895;transform:rotate(-10deg)"></div>
          <div class="float-pill" style="left:1960px;top:450px;width:200px;height:66px;background:#8bb4f7;transform:rotate(20deg)"></div>
          <div class="float-pill" style="left:1500px;top:430px;width:84px;height:84px;background:#f2d160"></div>
          <div class="float-pill" style="left:1980px;top:1380px;width:90px;height:90px;background:#c4d94e"></div>

          <!-- area A: button + topic card -->
          <div class="desk-a"></div>
          <div class="btn" id="btn">Tìm hiểu</div>
          <div class="slot" id="slot"></div>
          <div class="card" id="card">
            <div class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="card-body">
              <div class="tag">CHỦ ĐỀ</div>
              <div class="card-title">Gemini 4 Argon</div>
            </div>
          </div>

          <!-- area B: the next region the camera slides to -->
          <div class="desk-b"></div>
          <div class="panel" id="panel">
            <div class="type-line"><span id="typed"></span><span class="caret" id="caret"></span></div>
            <div class="bar" style="width:640px;background:#c5b5e0"></div>
            <div class="bar" style="width:520px;background:#a8e6cf"></div>
            <div class="bar" style="width:580px;background:#f5b895"></div>
            <div class="next" id="next">Tiếp theo</div>
          </div>

          <!-- the oversized cursor lives in world space so the camera magnifies it -->
          <div class="cursor" id="cursor">
            <svg id="cur-arrow" width="70" height="104" viewBox="0 0 70 104">
              <path
                id="arrow-path"
                d="M0 0 L0 86 L22 66 L37 100 L54 92 L39 59 L68 59 Z"
                fill="#1a1a1a"
                stroke="#ffffff"
                stroke-width="5"
                stroke-linejoin="round"
              />
            </svg>
            <svg id="cur-open" width="96" height="100" viewBox="0 0 96 100">
              <g id="open-g" fill="#a06ce8" stroke="#1e1e1e" stroke-width="4">
                <rect x="10" y="10" width="16" height="50" rx="8" />
                <rect x="28" y="2" width="16" height="56" rx="8" />
                <rect x="46" y="4" width="16" height="54" rx="8" />
                <rect x="64" y="12" width="16" height="48" rx="8" />
                <rect x="8" y="40" width="74" height="54" rx="26" />
              </g>
            </svg>
            <svg id="cur-fist" width="96" height="100" viewBox="0 0 96 100">
              <g id="fist-g" fill="#a06ce8" stroke="#1e1e1e" stroke-width="4">
                <rect x="10" y="26" width="16" height="26" rx="8" />
                <rect x="28" y="22" width="16" height="28" rx="8" />
                <rect x="46" y="22" width="16" height="28" rx="8" />
                <rect x="64" y="26" width="16" height="26" rx="8" />
                <rect x="8" y="40" width="74" height="54" rx="26" />
              </g>
            </svg>
          </div>
        </div>
        <div class="grain"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 3;
      const tl = gsap.timeline({ paused: true });

      /* ---------- camera: viewport-change single .world + multi-phase-camera drift ---------- */
      // World coords; frame center c = (540, 960). Single-wrapper form: T = -offset × S.
      const world = document.getElementById("world");
      const C = { x: 540, y: 960 };
      const camFor = (fx, fy, s) => ({ scale: s, x: -(fx - C.x) * s, y: -(fy - C.y) * s });
      const cam = camFor(540, 1120, 1.45); // opens tight on the button (zoom-out reveal start)
      const push = { v: 1 }; // composite scale channel for the press push
      const drift = { p: 0 };
      function applyCamera() {
        const dx = Math.sin(drift.p) * 6;
        const dy = Math.sin(drift.p * 1.3) * 3;
        const s = cam.scale * push.v;
        world.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${s})`;
      }
      applyCamera();

      // Phase 1 — follow the cursor in toward the button
      tl.to(cam, { ...camFor(540, 1150, 1.38), duration: 0.6, ease: "power2.out", onUpdate: applyCamera }, 0);
      // Press push (camera rides the click), then release
      tl.to(push, { v: 1.05, duration: 0.14, ease: "power2.out", onUpdate: applyCamera }, 0.6);
      tl.to(push, { v: 1, duration: 0.5, ease: "power2.inOut", onUpdate: applyCamera }, 0.74);
      // Phase 2 — reframe up onto the topic card the press produced
      tl.to(cam, { ...camFor(540, 930, 1.3), duration: 0.55, ease: "power2.inOut", onUpdate: applyCamera }, 0.72);
      // Phase 3 — chase the drag to the right while pulling out
      tl.to(cam, { ...camFor(1120, 900, 1.06), duration: 0.7, ease: "power2.inOut", onUpdate: applyCamera }, 1.3);
      // Phase 4 — slide on to the next area of the same desk, landing wide
      tl.to(cam, { ...camFor(1700, 940, 1.0), duration: 0.72, ease: "power2.inOut", onUpdate: applyCamera }, 2.0);
      // Drift spans the whole composition
      tl.to(drift, { p: Math.PI * 2 * 1.5, duration: DURATION, ease: "none", onUpdate: applyCamera }, 0);

      /* ---------- context-sensitive cursor: icon + color follow what is under the tip ---------- */
      const arrowEl = document.getElementById("cur-arrow");
      const openEl = document.getElementById("cur-open");
      const fistEl = document.getElementById("cur-fist");
      const arrowPath = document.getElementById("arrow-path");
      const openG = document.getElementById("open-g");
      const fistG = document.getElementById("fist-g");
      const CURSOR_SEQ = [
        { t: 0, mode: "arrow", color: "#1a1a1a" },
        { t: 0.42, mode: "arrow", color: "#e85d4e" }, // over the button
        { t: 0.98, mode: "open", color: "#a06ce8" }, // over the draggable card
        { t: 1.12, mode: "fist", color: "#a06ce8" }, // grabbed
        { t: 1.97, mode: "open", color: "#a06ce8" }, // released
        { t: 2.2, mode: "arrow", color: "#1a1a1a" },
        { t: 2.62, mode: "arrow", color: "#c4d94e" }, // over "Tiếp theo"
      ];
      const cursorAt = (t) => {
        for (let i = CURSOR_SEQ.length - 1; i >= 0; i--) if (t >= CURSOR_SEQ[i].t) return CURSOR_SEQ[i];
        return CURSOR_SEQ[0];
      };

      /* ---------- typed heading in area B with a context-colored caret ---------- */
      const typedEl = document.getElementById("typed");
      const caretEl = document.getElementById("caret");
      const TYPE_CHARS = Array.from("Có gì mới?");
      const TYPE_AT = 2.2;
      const TYPE_STEP = 0.055;
      const TYPE_END = TYPE_AT + TYPE_CHARS.length * TYPE_STEP;
      const BLINK_CYCLES = 6; // whole number over DURATION (0.5 s period)

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            const e = cursorAt(driver.t);
            arrowEl.style.display = e.mode === "arrow" ? "block" : "none";
            openEl.style.display = e.mode === "open" ? "block" : "none";
            fistEl.style.display = e.mode === "fist" ? "block" : "none";
            arrowPath.setAttribute("fill", e.color);
            openG.setAttribute("fill", e.color);
            fistG.setAttribute("fill", e.color);

            const n = Math.max(0, Math.min(TYPE_CHARS.length, Math.floor((driver.t - TYPE_AT) / TYPE_STEP) + 1));
            typedEl.textContent = driver.t < TYPE_AT ? "" : TYPE_CHARS.slice(0, n).join("");
            const typing = driver.t >= TYPE_AT && driver.t < TYPE_END + 0.15;
            const blinkOn = Math.sin((driver.t / DURATION) * Math.PI * 2 * BLINK_CYCLES) > 0;
            caretEl.style.opacity = typing || blinkOn ? "1" : "0";
            caretEl.style.background = driver.t >= TYPE_END ? "#e85d4e" : "#a06ce8";
          },
        },
        0,
      );

      /* ---------- hook: cursor glides in, physics press on the button ---------- */
      const BTN = { x: 560, y: 1190 };
      gsap.set("#cursor", { x: 980, y: 1680 });
      tl.fromTo("#cursor", { x: 980, y: 1680 }, { x: BTN.x, y: BTN.y, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
      const PRESS_AT = 0.6;
      tl.to(["#btn", "#cursor"], { scale: 0.86, duration: 0.12, ease: "power1.in" }, PRESS_AT);
      tl.to("#btn", { boxShadow: "inset 0 0 0 10px rgba(26,26,26,0.18)", duration: 0.12, ease: "power1.in" }, PRESS_AT);
      tl.to(["#btn", "#cursor"], { scale: 1, duration: 0.45, ease: "back.out(2)" }, PRESS_AT + 0.14);
      tl.to("#btn", { boxShadow: "8px 8px 0 rgba(26,26,26,0.12)", duration: 0.45, ease: "power2.out" }, PRESS_AT + 0.14);

      // the press springs the topic card out of the button
      gsap.set("#card", { scale: 0, x: 0, y: 360 });
      tl.fromTo(
        "#card",
        { scale: 0, y: 360, rotation: -6 },
        { scale: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.7)", immediateRender: false },
        0.7,
      );

      /* ---------- cursor-drag: approach grip, grab, lockstep travel, release ---------- */
      const GRIP = { x: 240, y: 830 };
      tl.fromTo("#cursor", { x: BTN.x, y: BTN.y }, { x: GRIP.x, y: GRIP.y, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 0.8);
      const GRAB_AT = 1.12;
      tl.to(["#card", "#cursor"], { scale: 0.94, duration: 0.08, ease: "power1.in" }, GRAB_AT);
      tl.set("#slot", { opacity: 1 }, GRAB_AT + 0.08);
      tl.to("#card", { scale: 1.05, rotation: -3, boxShadow: "22px 26px 0 rgba(26,26,26,0.14)", duration: 0.14, ease: "power2.out" }, GRAB_AT + 0.08);
      tl.to("#cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, GRAB_AT + 0.08);

      const TRAVEL_AT = 1.34;
      const TRAVEL_DUR = 0.65;
      const DX = 660;
      const DY = 60;
      tl.fromTo("#card", { x: 0, y: 0 }, { x: DX, y: DY, duration: TRAVEL_DUR, ease: "power2.inOut", immediateRender: false }, TRAVEL_AT);
      tl.fromTo(
        "#cursor",
        { x: GRIP.x, y: GRIP.y },
        { x: GRIP.x + DX, y: GRIP.y + DY, duration: TRAVEL_DUR, ease: "power2.inOut", immediateRender: false },
        TRAVEL_AT,
      );

      // release: the card springs back home to its slot
      const DROP_AT = TRAVEL_AT + TRAVEL_DUR;
      tl.to("#card", { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.85, ease: "elastic.out(1, 0.45)" }, DROP_AT);
      tl.to("#card", { boxShadow: "8px 8px 0 rgba(26,26,26,0.1)", duration: 0.3, ease: "power2.out" }, DROP_AT);
      tl.set("#slot", { opacity: 0 }, DROP_AT + 0.5);

      /* ---------- next area: cursor glides on, heading types, bars fill, hover pop ---------- */
      tl.fromTo(
        "#cursor",
        { x: GRIP.x + DX, y: GRIP.y + DY },
        { x: 1500, y: 1170, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        2.02,
      );
      tl.fromTo(".bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.1, immediateRender: false }, 2.35);
      tl.fromTo("#next", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, 2.66);
      tl.to("#cursor", { x: 1470, y: 1160, duration: 0.28, ease: "sine.inOut" }, 2.72);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
