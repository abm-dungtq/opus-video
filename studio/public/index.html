<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="__STUDIO_TOKEN__">
  <title>Motion Studio · opus-video</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231f4fd6%27/%3E%3Cpath d=%27M6 4l6 4-6 4z%27 fill=%27white%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Motion Studio</div>
      <select id="project-select" aria-label="Dự án"></select>
      <button id="new-btn" class="btn" type="button">Dự án mới</button>
      <div id="project-title" class="title"></div>
      <div class="spacer"></div>
      <button id="agent-chip" class="chip" type="button">Claude Code</button>
      <select id="version-select" aria-label="Phiên bản"></select>
      <button id="undo-btn" class="btn" title="Hoàn tác (Ctrl/Cmd+Z)">Hoàn tác</button>
      <button id="export-btn" class="btn primary">Xuất video</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <aside class="left">
      <nav class="rail" role="tablist" aria-label="Khu làm việc" aria-orientation="vertical"></nav>
      <section id="panel" class="panel" role="tabpanel" tabindex="-1"></section>
    </aside>

    <main class="stage">
      <div id="player" class="player"><div class="player-empty">Chọn một dự án</div></div>
      <div class="transport">
        <button id="play-btn" class="btn icon" aria-label="Phát"><span class="glyph play"></span></button>
        <span id="time" class="time">0:00.0 / 0:00.0</span>
      </div>
    </main>

    <aside class="right" id="inspector"></aside>

    <section class="bottom">
      <div class="timeline-bar">
        <span class="hint">Kéo mép phải shot để đổi độ dài · kéo câu thoại để dời</span>
        <div class="spacer"></div>
        <button id="zoom-out" class="btn icon" aria-label="Thu nhỏ">−</button>
        <button id="zoom-in" class="btn icon" aria-label="Phóng to">+</button>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
